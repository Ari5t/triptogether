name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://triptogether:triptogether@localhost:5432/triptogether
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: triptogether, POSTGRES_PASSWORD: triptogether, POSTGRES_DB: triptogether }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triptogether" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @triptogether/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        continue-on-error: true # shortcut: no migrations committed yet, make blocking after the first `prisma migrate dev`
      - name: i18n keys match
        run: node scripts/check-i18n.mjs
