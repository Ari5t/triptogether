services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: triptogether
      POSTGRES_PASSWORD: triptogether
      POSTGRES_DB: triptogether
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:8.10
    ports: ["6379:6379"]
volumes:
  pgdata:
